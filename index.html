<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d32">
<meta name="description" content="Morgenbrief – täglich kuratierte Nachrichten aus Weltpolitik, Wissenschaft, Wirtschaft und Brandenburg.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morgenbrief">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Morgenbrief</title>
<style>
:root{--bg:#f3f1eb;--surface:#fffdf8;--surface2:#ece8de;--text:#18211e;--muted:#6b746f;--line:#d8d3c9;--green:#173d32;--green2:#245b4b;--gold:#e9a65a;--shadow:0 14px 40px rgba(24,33,30,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.58 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit}.wrap{width:min(900px,calc(100% - 28px));margin:auto}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.topbar .wrap{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;font:700 20px/1 Georgia,serif}.brand svg{width:38px;height:38px;border-radius:11px;box-shadow:0 6px 16px rgba(23,61,50,.18)}.updated{font-size:12px;color:var(--muted)}
main{padding:22px 0 44px}.hero{background:linear-gradient(145deg,var(--green),#102d25);color:#f8f4eb;border-radius:28px;padding:28px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(233,166,90,.12);right:-60px;top:-70px}.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;opacity:.72}.hero h1{font:500 clamp(38px,8vw,62px)/1 Georgia,serif;letter-spacing:-.04em;margin:9px 0 12px}.hero p{margin:0;max-width:700px;font-size:17px;color:#dfe8e3}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{min-height:42px;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:0 15px;background:rgba(255,255,255,.08);color:inherit;font-weight:750}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17211e}.btn:active{transform:translateY(1px)}
.summary{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.summary-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.summary h2{font:600 24px Georgia,serif;margin:2px 0}.summary ol{margin:14px 0 0;padding-left:22px;display:grid;gap:9px}.summary li::marker{color:var(--gold);font-weight:800}
.nav-shell{position:sticky;top:68px;z-index:15;background:linear-gradient(var(--bg) 76%,transparent);padding:14px 0 12px}.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 13px;font-weight:700}.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.tools{display:flex;gap:9px;margin:4px 0 18px}.search{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;color:var(--text)}.refresh{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:18px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:16px 2px 12px}.section-title h2{font:600 29px Georgia,serif;margin:0}.count{font-size:12px;color:var(--muted)}
.stories{display:grid;gap:14px}.story{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(24,33,30,.045)}.story-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.category{display:inline-flex;align-items:center;border-radius:999px;background:var(--surface2);padding:5px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--green2)}.story h3{font:600 clamp(23px,5vw,31px)/1.08 Georgia,serif;letter-spacing:-.025em;margin:0 0 10px}.story>p{font-size:16px;color:#4f5954;margin:0}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;list-style:none;font-weight:800;color:var(--green2)}summary::-webkit-details-marker{display:none}summary:after{content:"＋";float:right;font-size:18px}details[open] summary:after{content:"−"}.detail-grid{display:grid;gap:12px;margin-top:13px}.detail-grid strong{font-size:12px;text-transform:uppercase;letter-spacing:.07em}.detail-grid p{margin:3px 0 0;color:var(--muted)}
.sources{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.sources a{color:var(--green2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}
.archive{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}.archive h2{font:600 25px Georgia,serif;margin:4px 0 12px}.archive button{margin:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);padding:8px 11px}
footer{padding:28px 2px 40px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
@media(max-width:560px){.wrap{width:min(100% - 20px,900px)}.topbar .wrap{height:62px}.nav-shell{top:62px}.hero{border-radius:22px;padding:23px 20px}.hero h1{font-size:42px}.summary,.story{border-radius:18px}.story{padding:18px}.updated{display:none}}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--surface:#171d1a;--surface2:#232b27;--text:#f3f0e8;--muted:#a7aea9;--line:#303833;--green:#214d40;--green2:#9ccbbb;--shadow:none}.sources a{background:#121713}.search,.refresh,.chip{background:var(--surface)}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="118" fill="#173D32"/><circle cx="256" cy="132" r="43" fill="#E9A65A"/><path d="M124 348V184h60l72 88 72-88h60v164h-58v-83l-74 89-74-89v83z" fill="#F6F1E7"/><rect x="152" y="382" width="208" height="18" rx="9" fill="#E9A65A"/></svg>
    <span>Morgenbrief</span>
  </div>
  <span class="updated" id="updated">Täglich · 07:00</span>
</div></header>
<main class="wrap">
<section class="hero">
  <div class="kicker" id="date">Morgenbrief</div>
  <h1>Das Wesentliche. Klar sortiert.</h1>
  <p id="intro">Weltpolitik, Wissenschaft, Wirtschaft und Brandenburg – ohne unnötiges Rauschen.</p>
  <div class="hero-actions"><button class="btn primary" id="summaryJump">30-Sekunden-Überblick</button><button class="btn" id="archiveBtn">Archiv</button><button class="btn" id="installBtn" hidden>App installieren</button></div>
</section>

<section class="summary" id="summary">
  <div class="summary-head"><div><div class="kicker" style="color:var(--muted);opacity:1">Kurzfassung</div><h2>Heute in 30 Sekunden</h2></div></div>
  <ol id="quickList"></ol>
</section>

<div class="nav-shell"><div class="chips" id="chips">
  <button class="chip active" data-cat="all">Alles</button>
  <button class="chip" data-cat="weltpolitik">Weltpolitik</button>
  <button class="chip" data-cat="wissenschaft">Wissenschaft</button>
  <button class="chip" data-cat="wirtschaft">Wirtschaft</button>
  <button class="chip" data-cat="brandenburg">Brandenburg</button>
</div></div>

<div class="tools"><input class="search" id="search" type="search" placeholder="Meldungen durchsuchen"><button class="refresh" id="refresh" aria-label="Aktualisieren">↻</button></div>
<div class="section-title"><h2>Nachrichten</h2><span class="count" id="count"></span></div>
<section class="stories" id="stories"></section>

<section class="archive" id="archive" hidden><div class="kicker" style="color:var(--muted);opacity:1">Archiv</div><h2>Frühere Ausgaben</h2><div id="archiveList"></div></section>
<footer><span>Morgenbrief</span><span id="foot">Aktuelle Ausgabe</span></footer>
</main>

<script>
const labels={weltpolitik:"Weltpolitik",wissenschaft:"Wissenschaft",wirtschaft:"Wirtschaft",brandenburg:"Brandenburg"};
let brief=null,cat="all",query="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(d){const [y,m,day]=d.split("-").map(Number);return new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,day)))}
function render(){
 if(!brief)return;
 const q=query.trim().toLowerCase();
 const stories=(brief.stories||[]).filter(s=>(cat==="all"||s.category===cat)&&(!q||[s.title,s.summary,s.why_it_matters,s.open_questions].join(" ").toLowerCase().includes(q)));
 $("count").textContent=stories.length+" "+(stories.length===1?"Meldung":"Meldungen");
 $("stories").innerHTML=stories.length?stories.map(s=>`<article class="story">
   <div class="story-top"><span class="category">${esc(labels[s.category]||s.category)}</span></div>
   <h3>${esc(s.title)}</h3>
   <p>${esc(s.summary)}</p>
   <details><summary>Einordnung</summary><div class="detail-grid">
     <div><strong>Warum wichtig</strong><p>${esc(s.why_it_matters)}</p></div>
     <div><strong>Offen / unsicher</strong><p>${esc(s.open_questions||"Keine wesentliche offene Frage hervorgehoben.")}</p></div>
   </div></details>
   <div class="sources">${(s.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}</a>`).join("")}</div>
 </article>`).join(""):'<div class="empty">Keine passende Meldung in dieser Ausgabe.</div>';
}
async function load(path="data/latest.json"){
 const r=await fetch(path+"?v="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 brief=await r.json();
 $("date").textContent=fmt(brief.date);
 $("intro").textContent=brief.intro||"Die wichtigsten Entwicklungen des Tages.";
 $("foot").textContent=fmt(brief.date);
 $("quickList").innerHTML=(brief.quick_read||[]).map(x=>`<li><strong>${esc(x.title)}:</strong> ${esc(x.text)}</li>`).join("");
 render();
}
async function showArchive(){
 const r=await fetch("data/archive/index.json?v="+Date.now(),{cache:"no-store"});
 const d=await r.json();
 $("archive").hidden=false;
 $("archive").scrollIntoView({behavior:"smooth",block:"start"});
 $("archiveList").innerHTML=(d.issues||[]).length?(d.issues||[]).map(i=>`<button data-path="${esc(i.path)}">${esc(fmt(i.date))}</button>`).join(""):"Noch keine archivierten Ausgaben.";
}
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()});
$("search").addEventListener("input",e=>{query=e.target.value;render()});
$("refresh").addEventListener("click",()=>load().catch(()=>{}));
$("summaryJump").addEventListener("click",()=>$("summary").scrollIntoView({behavior:"smooth",block:"start"}));
$("archiveBtn").addEventListener("click",()=>showArchive().catch(()=>{}));
$("archiveList").addEventListener("click",e=>{const b=e.target.closest("[data-path]");if(b)load(b.dataset.path).then(()=>$("stories").scrollIntoView({behavior:"smooth"}))});
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;$("installBtn").hidden=false});
$("installBtn").addEventListener("click",async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$("installBtn").hidden=true});
window.addEventListener("appinstalled",()=>{$("installBtn").hidden=true;deferredInstallPrompt=null});
load().catch(()=>{$("stories").innerHTML='<div class="empty">Der Morgenbrief konnte gerade nicht geladen werden. Bitte aktualisieren.</div>'});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script>
</body>
</html>
