plugins {
    id 'com.android.application'
}

android {
    namespace 'de.morgenbrief.app'
    compileSdk 35

    defaultConfig {
        applicationId "de.morgenbrief.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
